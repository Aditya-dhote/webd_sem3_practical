<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal To-Do List</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-br from-blue-100 to-purple-100 min-h-screen">

    <header class="bg-blue-600 text-white text-center p-6 shadow">
        <h1 class="text-3xl font-bold">Personal To-Do List</h1>
        <p>Manage your daily academic and personal tasks</p>
    </header>

    <main class="max-w-xl mx-auto p-5">

        <section class="bg-white p-5 rounded-xl shadow-md">
            <h2 class="text-xl font-bold mb-4">Add New Task</h2>

            <div class="flex gap-2">
                <input id="taskInput" type="text"
                    placeholder="Enter your task"
                    class="flex-1 border rounded-lg p-3">

                <button onclick="addTask()"
                    class="bg-blue-600 text-white px-5 rounded-lg">
                    Add
                </button>
            </div>
        </section>

        <section class="bg-white p-5 rounded-xl shadow-md mt-5">
            <div class="flex justify-between mb-4">
                <h2 class="text-xl font-bold">My Tasks</h2>
                <span id="count"
                    class="bg-blue-100 text-blue-600 px-3 py-1 rounded-full">
                    0 Tasks
                </span>
            </div>

            <ul id="taskList" class="space-y-3"></ul>

            <p id="empty" class="text-center text-gray-500">
                No tasks added yet.
            </p>
        </section>

    </main>

    <script>
        let tasks = [];

        function addTask() {
            let input = document.getElementById("taskInput");
            let text = input.value.trim();

            if (text === "") {
                alert("Please enter a task.");
                return;
            }

            tasks.push({ text: text, completed: false });
            input.value = "";
            displayTasks();
        }

        function displayTasks() {
            let list = document.getElementById("taskList");
            let empty = document.getElementById("empty");

            list.innerHTML = "";

            empty.style.display = tasks.length ? "none" : "block";

            tasks.forEach(function(task, index) {
                let li = document.createElement("li");

                li.className =
                    "flex justify-between items-center p-3 " +
                    "bg-gray-50 border rounded-lg";

                li.innerHTML = `
                    <div class="flex items-center gap-3">
                        <input type="checkbox"
                            ${task.completed ? "checked" : ""}
                            onchange="completeTask(${index})">

                        <span class="${
                            task.completed
                            ? "line-through text-gray-400"
                            : ""
                        }">
                            ${task.text}
                        </span>
                    </div>

                    <button onclick="deleteTask(${index})"
                        class="bg-red-500 text-white px-3 py-1 rounded">
                        Delete
                    </button>
                `;

                list.appendChild(li);
            });

            document.getElementById("count").textContent =
                tasks.length + " Tasks";
        }

        function completeTask(index) {
            tasks[index].completed = !tasks[index].completed;
            displayTasks();
        }

        function deleteTask(index) {
            tasks.splice(index, 1);
            displayTasks();
        }
    </script>

</body>
</html>
